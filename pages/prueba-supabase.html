<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Supabase — EME GAMES</title><link rel="stylesheet" href="../styles.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><p class="eyebrow">DESARROLLO</p><h1>PRUEBA SUPABASE</h1><p>Comprobación temporal de conexión entre EME GAMES y Supabase.</p></div></section><section class="content-section"><div class="container"><div class="form-wrap"><button class="button button-primary" id="test-connection" type="button">Probar conexión</button><div class="notice" id="test-result" style="margin-top:20px">Pulsa el botón para comprobar la conexión.</div></div></div></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/auth.js"></script><script src="../js/page.js"></script><script>
document.getElementById('test-connection').addEventListener('click', async () => {
  const result = document.getElementById('test-result');
  result.textContent = 'Conectando...';
  try {
    const { data, error } = await window.EMESupabase.from('games').select('id,name').limit(5);
    if (error) throw error;
    result.textContent = `Conexión correcta. Supabase respondió correctamente. Juegos encontrados: ${data.length}.`;
  } catch (error) {
    console.error(error);
    result.textContent = `Error de conexión o permisos: ${error.message}`;
  }
});
</script></body></html>
